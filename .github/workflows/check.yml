name: check

# The same check.sh a reviewer would run locally, on every push, in strict
# mode: a tool that is missing fails the run instead of being skipped. Weekly
# as well, because the analysers' rulesets move even when the code does not.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a commit, not a tag: a tag can be moved.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # gitleaks below scans the whole history, not the tip
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install the Python analysers and PSScriptAnalyzer
        run: |
          python -m pip install --quiet ruff bandit mypy semgrep
          pwsh -NoProfile -Command 'Install-Module PSScriptAnalyzer -Force -Scope CurrentUser'

      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          set -euo pipefail
          V=8.30.1
          curl -sSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: check.sh, strict
        run: CHECK_STRICT=1 ./check.sh

      - name: gitleaks over the full git history
        run: gitleaks detect --source . --redact
